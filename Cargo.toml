[package]
name = "weoc"
version = "1.0.0"
edition = "2024"
description = "Official Weond CLI — manage deployments, projects, and live logs from your terminal"
license = "MIT"
repository = "https://github.com/weondhq/cli"
homepage = "https://weond.com"
readme = "README.md"
keywords = ["weond", "cli", "cloud", "deploy", "edge"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "weoc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.19"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
